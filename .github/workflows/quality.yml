name: Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build application
        run: bun run build

      - name: Scan production bundle for fabricated content
        run: node scripts/scan-bundle-for-fabricated-content.mjs

      - name: Build server
        run: bun run build:server

  database:
    name: Database (pgTAP) and real-backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase (pinned CLI)
        run: npx --yes supabase@2.115.0 start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor

      - name: Run pgTAP suite
        run: npx --yes supabase@2.115.0 test db

      - name: Run real-backend integration tests
        run: |
          eval "$(npx --yes supabase@2.115.0 status -o env)"
          export SMC_REAL_SUPABASE_URL="$API_URL"
          export SMC_REAL_SUPABASE_ANON_KEY="$ANON_KEY"
          export SMC_REAL_SUPABASE_SERVICE_KEY="$SERVICE_ROLE_KEY"
          test -n "$SMC_REAL_SUPABASE_URL" && test -n "$SMC_REAL_SUPABASE_ANON_KEY" && test -n "$SMC_REAL_SUPABASE_SERVICE_KEY"
          bun run test:integration

      - name: Supabase advisors (report only)
        if: always()
        run: npx --yes supabase@2.115.0 db advisors --local --type all --level warn || true

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.115.0 stop --no-backup
