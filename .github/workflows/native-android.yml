name: Native Android (debug)

# Phase M1: compiles a DEBUG APK and verifies the packaged manifest and
# Capacitor config. Never builds release, never creates or uses a signing key:
# the debug APK is signed with the runner's auto-generated, throwaway Android
# debug key and is for physical-device QA only.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "phase-m-**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug build + manifest verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up JDK 21 (required by Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No VITE_* environment is provided: the bundle is built exactly as the
      # repository defines it and fails closed ("setup required") at runtime.
      - name: Build web bundle
        run: bun run build

      - name: Sync Capacitor (android)
        run: npx cap sync android

      - name: Compile debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK manifest, permissions, deep links and packaged config
        run: |
          set -o pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" > badging.txt
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          unzip -p "$APK" assets/capacitor.config.json > capacitor.config.json
          unzip -l "$APK" | grep -q "assets/public/index.html"
          ls -l "$APK"
          node scripts/ci/verify-android-debug.mjs badging.txt manifest.txt capacitor.config.json | tee verify.txt || {
            status=$?
            summary=$(sed 's/%/%25/g' verify.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android APK verification::${summary}"
            exit $status
          }
          summary=$(sed 's/%/%25/g' verify.txt | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Android APK verification::${summary}"
          size=$(stat -c %s "$APK")
          echo "::notice title=Android debug APK::app-debug.apk ${size} bytes (debug-signed, not for distribution)"

      - name: Upload debug APK (physical-device QA only)
        uses: actions/upload-artifact@v7
        with:
          name: smc-pro-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
