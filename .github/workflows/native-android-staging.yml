name: Native Android (STAGING debug)

# Phase M2: the debug APK for physical-device QA, built against the STAGING
# Supabase project only (.env.staging: public URL + publishable key). Never
# builds release, never creates or uses a signing key: the APK is signed with
# the runner's throwaway debug key and is not for distribution.
on:
  push:
    branches:
      - "phase-m2-**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-staging-debug:
    name: Android STAGING debug build + verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up JDK 21 (required by Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # build:android:staging = vite build --mode staging, then the client-bundle
      # check (staging backend only, no secrets, no localhost, self-hosted
      # fonts), then cap sync android. Any failed check stops the build.
      - name: Build STAGING web bundle, verify it, sync Capacitor
        run: bun run build:android:staging

      - name: Compile debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK (manifest, permissions, deep links, packaged config, packaged bundle)
        run: |
          set -o pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" > badging.txt
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          unzip -p "$APK" assets/capacitor.config.json > capacitor.config.json
          rm -rf apk-web && mkdir apk-web && unzip -q "$APK" 'assets/public/*' -d apk-web
          # Both verifiers always run; the step fails if either fails.
          {
            node scripts/ci/verify-android-debug.mjs badging.txt manifest.txt capacitor.config.json; apk=$?
            echo
            node scripts/check-client-bundle.mjs staging apk-web/assets/public; web=$?
            exit $(( apk || web ))
          } | tee verify.txt || {
            status=$?
            summary=$(sed 's/%/%25/g' verify.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android STAGING APK verification::${summary}"
            exit $status
          }
          summary=$(sed 's/%/%25/g' verify.txt | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Android STAGING APK verification::${summary}"
          size=$(stat -c %s "$APK")
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "::notice title=Android STAGING debug APK::app-debug.apk ${size} bytes, sha256 ${sha} (debug-signed, staging backend, not for distribution)"

      - name: Upload STAGING debug APK (physical-device QA only)
        uses: actions/upload-artifact@v7
        with:
          name: smc-pro-studio-STAGING-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
